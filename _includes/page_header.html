<div class="container">
	<h1>{{ site.texture.title }}</h1>
	<h2>{{ site.texture.tagline }}</h2>
	<ul class="social">
		{%- if site.texture.social_links.github -%}
			<li><a href="https://github.com/{{ site.texture.social_links.github }}" aria-label="GitHub"><i class="icon-github-circled" aria-hidden="true"></i></a></li>
		{%- endif -%}
		{%- if site.texture.social_links.linkedIn -%}
			<li><a href="https://linkedin.com/{{ site.texture.social_links.linkedIn }}" aria-label="LinkedIn"><i class="icon-linkedin-squared" aria-hidden="true"></i></a></li>
		{%- endif -%}
		{%- if site.texture.social_links.twitter -%}
			<li><a href="https://twitter.com/{{ site.texture.social_links.twitter }}" aria-label="Twitter"><i class="icon-twitter-squared" aria-hidden="true"></i></a></li>
		{%- endif -%}
	</ul>
</div>
