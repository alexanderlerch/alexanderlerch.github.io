{%- if site.texture.showNav -%}
<nav class="navbar" aria-label="main">
	<ul>
		{% for link in site.texture.navigation %}
		<li{% if link.url == page.url %} class="active"{% endif %}><a href="{{ link.url | prepend:site.baseurl }}"{% if link.url == page.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
		{% endfor %}
	</ul>
</nav>
{%- endif -%}
